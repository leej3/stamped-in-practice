repos:
  - repo: local
    hooks:
      - id: snapper
        name: Format authored prose with Snapper
        entry: snapper --in-place
        language: system
        types: [markdown]
        exclude: ^(assessment-series/[^/]+/synthesis/(?!README\.md$)|(resources|rounds|superseded-six-worker-waves|preparation|prompts)/|(measurement-development|skill-reflection)/[^/]+/(?!README\.md$)|scientific-(task|judging)\.md$)
