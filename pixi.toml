[workspace]
name = "stamped-in-practice"
channels = ["conda-forge"]
platforms = [{ platform = "osx-arm64", macos = "14.0" }, "linux-64"]

[dependencies]
python = ">=3.11,<3.14"
git = "*"
numpy = "*"
scipy = "*"
pandas = "*"
matplotlib-base = "*"
pyyaml = "*"
jsonschema = "*"
pre-commit = "*"
tomlkit = "*"
pytest = "*"
rfc3339-validator = "*"
nilearn = ">=0.14.1,<0.15"
nibabel = ">=5.4.2,<6"

[pypi-dependencies]
datalad = "*"
git-annex = "*"
con-duct = "*"
tiktoken = "*"
pytest-evals = "==0.3.4"
tox = "*"

[tasks]
pilot = { cmd = "duct --output-prefix logs/pilot- --message 'Three-map integrity and geometry pilot' python code/analyze.py --pilot", description = "Check a small sample of participant inputs and group-map structure" }
analysis = { cmd = "duct --output-prefix logs/group-analysis- --message 'Primary one-sample positive max-t permutation analysis' python code/analyze.py", description = "Run preregistered group inference, QC, tables and figures" }

